[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-finder"
version = "0.1.0"
description = "Find academically relevant papers based on your writing using LLM-powered keyword extraction and embedding-based ranking."
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "litellm>=1.40",
    "mcp>=1.4",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "PyMuPDF>=1.24",
    "openpyxl>=3.1",
    "rich>=13.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "mcp-server-google-scholar",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
research_finder = "research_finder.cli:cli"

[tool.uv.sources]
mcp-server-google-scholar = { git = "https://github.com/JackKuo666/Google-Scholar-MCP-Server.git", rev = "refs/pull/2/head" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
