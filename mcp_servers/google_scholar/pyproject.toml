[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-google-scholar"
version = "0.1.0"
description = "An MCP server for searching Google Scholar via web scraping"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.4.1",
    "scholarly>=1.7.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[tool.hatch.build.targets.wheel]
packages = ["google_scholar_mcp"]
